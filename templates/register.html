<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MAISCAN</title>
    <link rel="icon" type="image/x-icon" href="../static/assets/img/maiscan.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f5fdf4 0%, #e8f5e9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(46, 125, 50, 0.15);
        }
        .form-control, .form-select { border-color: #198754 !important; }
        .form-control:focus, .form-select:focus { box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25); }
        .section-header {
            color: #198754; font-weight: 700; border-bottom: 2px solid #e9ecef;
            padding-bottom: 10px; margin-bottom: 20px; margin-top: 10px; font-size: 0.9rem; text-transform: uppercase;
        }
        .btn-success { background: linear-gradient(135deg, #2E7D32 0%, #4CAF50 100%); border: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <div class="glass-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <img src="{{ url_for('static', filename='assets/img/maiscan.png') }}" alt="Logo" height="60" class="mb-3">
                        <h2 class="fw-bold text-success">Create Account</h2>
                    </div>

                    <form method="POST" id="registerForm">
                        <div class="row g-3">
                            
                            <div class="col-12">
                                <h6 class="section-header"><i class="fas fa-id-card me-2"></i>Personal Info</h6>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label fw-semibold text-success">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-success text-success"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control" name="full_name" required placeholder="Juan Dela Cruz">
                                </div>
                            </div>

                            <div class="col-md-7">
                                <label class="form-label fw-semibold text-success">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-success text-success"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" name="email" id="emailInput" required placeholder="juan@example.com">
                                    <button class="btn btn-success fw-bold text-light" type="button" id="sendCodeBtn" onclick="sendOTP()">
                                        Send Code
                                    </button>
                                </div>
                                <div id="emailFeedback" class="form-text text-danger" style="display:none;"></div>
                            </div>

                            <div class="col-md-5" id="otpSection" style="display: none;">
                                <label class="form-label fw-semibold text-success">Verification Code</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-success text-success"><i class="fas fa-key"></i></span>
                                    <input type="text" class="form-control" name="otp_code" id="otpInput" placeholder="123456" maxlength="6">
                                </div>
                                <div class="form-text text-success small">Code sent! Check your inbox.</div>
                            </div>

                            <div class="col-12 mt-4">
                                <h6 class="section-header"><i class="fas fa-map-marked-alt me-2"></i>Address Info</h6>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-success">Region</label>
                                <select id="region" class="form-select" required><option value="" disabled selected>Select Region</option></select>
                                <input type="hidden" name="region_text" id="region_text">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-success">Province</label>
                                <select id="province" class="form-select" disabled required><option value="" disabled selected>Select Region first...</option></select>
                                <input type="hidden" name="province_text" id="province_text">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-success">City/Municipality</label>
                                <select id="city" class="form-select" disabled required><option value="" disabled selected>Select Province first...</option></select>
                                <input type="hidden" name="city_text" id="city_text">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-success">Barangay</label>
                                <select id="barangay" class="form-select" disabled required><option value="" disabled selected>Select City first...</option></select>
                                <input type="hidden" name="barangay_text" id="barangay_text">
                            </div>
                            <div class="col-md-8">
                                <label class="form-label fw-semibold text-success">Street / Purok</label>
                                <input type="text" class="form-control" name="street" required placeholder="Purok 1">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold text-success">Zip Code</label>
                                <input type="number" class="form-control" name="zip_code" required placeholder="5200">
                            </div>

                            <div class="col-12 mt-4">
                                <h6 class="section-header"><i class="fas fa-lock me-2"></i>Security</h6>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-success">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-success text-success"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" required minlength="6">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-success">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-success text-success"><i class="fas fa-check-double"></i></span>
                                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                                </div>
                            </div>

                            <!-- <div class="col-12 mt-3">
                                <div class="form-check">
                                    <input class="form-check-input border-success" type="checkbox" id="terms" required>
                                    <label class="form-check-label small text-muted" for="terms">I agree to the Terms of Service</label>
                                </div>
                            </div> -->
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-success w-100 shadow-sm py-2 fw-bold">
                                    <i class="fas fa-user-plus me-2"></i>Create Account
                                </button>
                            </div>
                            
                            <div class="col-12 text-center mt-3">
                                <a href="{{ url_for('login') }}" class="fw-bold text-warning text-decoration-none">Already have an account? Sign In</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // --- 1. SEND OTP LOGIC ---
        function sendOTP() {
            const email = document.getElementById('emailInput').value;
            const btn = document.getElementById('sendCodeBtn');
            const feedback = document.getElementById('emailFeedback');
            const otpSection = document.getElementById('otpSection');
            const otpInput = document.getElementById('otpInput');

            // Basic Validation
            if (!email || !email.includes('@')) {
                feedback.style.display = 'block';
                feedback.textContent = 'Please enter a valid email address first.';
                return;
            }
            feedback.style.display = 'none';

            // Loading State
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            btn.disabled = true;

            // Call Backend API
            fetch('/api/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Success UI Updates
                    btn.innerHTML = '<i class="fas fa-check"></i> Sent';
                    btn.classList.remove('btn-warning');
                    btn.classList.add('btn-secondary'); // Grey out button
                    
                    // Show OTP Field
                    otpSection.style.display = 'block';
                    otpInput.required = true;
                    otpInput.focus();

                    // Start Timer (60 seconds cooldown)
                    let timeLeft = 60;
                    const timer = setInterval(() => {
                        if (timeLeft <= 0) {
                            clearInterval(timer);
                            btn.innerHTML = 'Resend Code';
                            btn.disabled = false;
                            btn.classList.add('btn-warning');
                            btn.classList.remove('btn-secondary');
                        } else {
                            btn.innerHTML = `Resend in ${timeLeft}s`;
                            timeLeft--;
                        }
                    }, 1000);

                } else {
                    // Error Handling
                    feedback.style.display = 'block';
                    feedback.textContent = data.message;
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                feedback.style.display = 'block';
                feedback.textContent = 'Network error. Please try again.';
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }

        // --- 2. ADDRESS API (Standard Logic) ---
        document.addEventListener('DOMContentLoaded', () => {
            const api_base = 'https://psgc.gitlab.io/api';
            
            const regionSelect = document.getElementById('region');
            const provinceSelect = document.getElementById('province');
            const citySelect = document.getElementById('city');
            const barangaySelect = document.getElementById('barangay');
            
            const regionText = document.getElementById('region_text');
            const provinceText = document.getElementById('province_text');
            const cityText = document.getElementById('city_text');
            const barangayText = document.getElementById('barangay_text');

            function populate(select, data, placeholder) {
                select.innerHTML = `<option value="" disabled selected>${placeholder}</option>`;
                data.sort((a, b) => a.name.localeCompare(b.name));
                data.forEach(item => {
                    let opt = document.createElement('option');
                    opt.value = item.code;
                    opt.text = item.name;
                    select.appendChild(opt);
                });
            }

            function toggle(el, enable) {
                el.disabled = !enable;
                if (!enable) el.innerHTML = '<option value="" disabled selected>Select...</option>';
            }

            // Load Regions
            fetch(`${api_base}/regions/`)
                .then(res => res.json())
                .then(data => populate(regionSelect, data, "Select Region"));

            // Region Change
            regionSelect.addEventListener('change', function() {
                regionText.value = this.options[this.selectedIndex].text;
                toggle(provinceSelect, false); toggle(citySelect, false); toggle(barangaySelect, false);
                
                const code = this.value;
                if(code === '130000000') { 
                    toggle(provinceSelect, false);
                    provinceText.value = "Metro Manila";
                    provinceSelect.innerHTML = '<option selected>Metro Manila</option>';
                    fetch(`${api_base}/regions/${code}/cities-municipalities/`)
                        .then(res => res.json())
                        .then(data => { populate(citySelect, data, "Select City"); toggle(citySelect, true); });
                } else {
                    fetch(`${api_base}/regions/${code}/provinces/`)
                        .then(res => res.json())
                        .then(data => { populate(provinceSelect, data, "Select Province"); toggle(provinceSelect, true); });
                }
            });

            // Province Change
            provinceSelect.addEventListener('change', function() {
                if(this.value === 'NCR') return;
                provinceText.value = this.options[this.selectedIndex].text;
                toggle(citySelect, false); toggle(barangaySelect, false);
                fetch(`${api_base}/provinces/${this.value}/cities-municipalities/`)
                    .then(res => res.json())
                    .then(data => { populate(citySelect, data, "Select City"); toggle(citySelect, true); });
            });

            // City Change
            citySelect.addEventListener('change', function() {
                cityText.value = this.options[this.selectedIndex].text;
                toggle(barangaySelect, false);
                fetch(`${api_base}/cities-municipalities/${this.value}/barangays/`)
                    .then(res => res.json())
                    .then(data => { populate(barangaySelect, data, "Select Barangay"); toggle(barangaySelect, true); });
            });

            // Barangay Change
            barangaySelect.addEventListener('change', function() {
                barangayText.value = this.options[this.selectedIndex].text;
            });
            
            // Validate Password Match
            document.querySelector('form').addEventListener('submit', function(e) {
                const p1 = document.getElementById('password').value;
                const p2 = document.getElementById('confirm_password').value;
                if(p1 !== p2) {
                    e.preventDefault();
                    alert("Passwords do not match!");
                }

            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Creating Account...';
            submitBtn.disabled = true;
            });
        });
    </script>
</body>
</html>
